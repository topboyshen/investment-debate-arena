limit_req_zone $binary_remote_addr zone=arena_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=netdata_cloud_per_ip:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=subscription_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=arena_conn_per_ip:10m;
log_format subscription_safe '$time_iso8601 method=$request_method status=$status '
                             'bytes=$body_bytes_sent';
log_format arena_safe '$time_iso8601 method=$request_method status=$status '
                      'bytes=$body_bytes_sent rt=$request_time '
                      'urt=$upstream_response_time';

server {
    access_log /var/log/nginx/debate-arena-safe.access.log arena_safe;
    listen 127.0.0.1:18765 default_server;
    listen [::1]:18765 default_server;
    server_name _;
    server_tokens off;

    # Cloudflare Tunnel connects locally; do not expose this origin listener
    # on the VPS public interfaces.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Cloudflare forwards the visitor scheme. Redirect before presenting the
    # Basic Auth challenge so credentials are never submitted over plain HTTP.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    # Exact, high-entropy subscription locations live in a root-only file.
    # This tracked config contains no client path or VLESS credential.
    include /etc/nginx/private-subscriptions.conf;

    location = /reports {
        return 308 /reports/;
    }

    # The only data endpoint: a whitelisted read-only export, never a DB,
    # source directory, inbox, log or general-purpose file browser.
    location = /reports/data.json {
        # Public read-only reports by owner request; Netdata remains protected.
        auth_basic off;
        limit_req zone=arena_per_ip burst=10 nodelay;
        limit_conn arena_conn_per_ip 5;
        limit_except GET { deny all; }
        alias /var/lib/project-portal/reports.json;
        disable_symlinks on;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    location ^~ /reports/ {
        auth_basic off;
        limit_req zone=arena_per_ip burst=10 nodelay;
        limit_conn arena_conn_per_ip 5;
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header Cache-Control;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /netdata {
        return 308 https://$host/netdata/;
    }

    # Netdata's official Nginx subfolder pattern. Cloudflare terminates TLS;
    # this origin remains private and accepts only Tunnel traffic.
    location ~ ^/netdata/(?<ndpath>.*)$ {
        auth_basic "Netdata Monitoring";
        auth_basic_user_file /etc/nginx/netdata.htpasswd;

        limit_req zone=netdata_cloud_per_ip burst=100 nodelay;
        limit_conn arena_conn_per_ip 20;

        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_set_header Connection "keep-alive";
        proxy_store off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:19999/$ndpath$is_args$args;

        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;

        gzip on;
        gzip_proxied any;
        gzip_types *;
    }

    location / {
        # Portal, Arena and reports are public; Netdata keeps its auth above.
        auth_basic off;

        limit_req zone=arena_per_ip burst=10 nodelay;
        limit_conn arena_conn_per_ip 5;

        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }
}
